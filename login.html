<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Solar Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; font-family: system-ui, sans-serif; }
    .card { background: #141414; border: 1px solid #222; }
    .neon { color: #facc15; }
    .btn-yellow { background: #eab308; color: #000; }
    .btn-yellow:hover { background: #ca8a04; }
    .input { background: #1a1a1a; border: 1px solid #333; color: #facc15; width: 100%; border-radius: 8px; padding: 12px 16px; }
    .input:focus { border-color: #eab308; outline: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SA Solar Logo" class="mx-auto mb-4 max-h-28 object-contain" onerror="this.style.display='none'">
      <h1 class="text-2xl font-bold neon">SOLAR MANAGER</h1>
      <p class="text-gray-500 text-sm mt-1">Online Business Management</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="mb-4 text-sm {% if cat=='error' %}text-red-400{% else %}text-green-400{% endif %}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Username</label>
        <input name="username" class="input" required autofocus placeholder="Username" autocomplete="username">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Password</label>
        <input name="password" type="password" class="input" required placeholder="Password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-yellow w-full rounded-lg py-3 font-semibold text-sm">LOGIN</button>
    </form>
  </div>
</body>
</html>
